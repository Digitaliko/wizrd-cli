name: 'Wizrd Claude Agent'
description: 'On-demand @claude agent for issue comments, PR comments, reviews, and ai: implement label. Loads optional .claude/ci-agent-context.md as system prompt. Pinned to anthropics/claude-code-action@v1.'
inputs:
  claude_token:
    description: 'CLAUDE_CODE_OAUTH_TOKEN secret (composite actions cannot read secrets directly — caller must pass it in).'
    required: true
  agent_context_path:
    description: 'Path to agent context file. Auto-discovers .claude/ci-agent-context.md → .claude/agent-context.md → CLAUDE.md.'
    required: false
    default: ''
  base_branch:
    description: 'Base branch for new PRs Claude creates.'
    required: false
    default: 'main'
  branch_prefix:
    description: 'Prefix for branches Claude creates.'
    required: false
    default: 'feat/'
  branch_name_template:
    description: 'Branch naming template passed to claude-code-action.'
    required: false
    default: '{{prefix}}{{description}}'
runs:
  using: composite
  steps:
    - name: Remove ai:implement label (if present)
      if: "${{ github.event_name == 'issues' && github.event.action == 'labeled' && github.event.label.name == 'ai: implement' }}"
      uses: actions/github-script@v7
      with:
        script: |
          try {
            await github.rest.issues.removeLabel({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              name: 'ai: implement'
            });
          } catch (e) {
            core.info(`Could not remove label: ${e.message}`);
          }

    - name: Discover agent context
      id: discover
      shell: bash
      run: |
        set -e
        AGENT="${{ inputs.agent_context_path }}"
        if [ -z "$AGENT" ]; then
          for candidate in .claude/ci-agent-context.md .claude/agent-context.md CLAUDE.md; do
            if [ -f "$candidate" ]; then AGENT="$candidate"; break; fi
          done
        fi
        echo "agent=$AGENT" >> "$GITHUB_OUTPUT"
        echo "Discovered agent context: ${AGENT:-<none>}"

    - name: Load agent instructions into env
      if: steps.discover.outputs.agent != ''
      shell: bash
      run: |
        {
          echo 'INSTRUCTIONS<<AGENT_EOF'
          cat "${{ steps.discover.outputs.agent }}"
          echo 'AGENT_EOF'
        } >> "$GITHUB_ENV"

    - name: Run Claude Code (with context)
      if: steps.discover.outputs.agent != ''
      uses: anthropics/claude-code-action@v1
      with:
        claude_code_oauth_token: ${{ inputs.claude_token }}
        base_branch: ${{ inputs.base_branch }}
        branch_prefix: ${{ inputs.branch_prefix }}
        branch_name_template: ${{ inputs.branch_name_template }}
        additional_permissions: |
          actions: read
        claude_args: '--append-system-prompt "${{ env.INSTRUCTIONS }}"'

    - name: Run Claude Code (no context)
      if: steps.discover.outputs.agent == ''
      uses: anthropics/claude-code-action@v1
      with:
        claude_code_oauth_token: ${{ inputs.claude_token }}
        base_branch: ${{ inputs.base_branch }}
        branch_prefix: ${{ inputs.branch_prefix }}
        branch_name_template: ${{ inputs.branch_name_template }}
        additional_permissions: |
          actions: read
