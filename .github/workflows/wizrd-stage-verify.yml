name: Wizrd Stage — Verify

on:
  workflow_call:
    inputs:
      issue_number:
        description: 'PR number.'
        required: false
        type: string
        default: ''
    secrets:
      claude_token:
        required: true

jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
      actions: write
      id-token: write
    concurrency:
      group: wizrd-verify-${{ github.event.pull_request.number || inputs.issue_number }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: refs/pull/${{ github.event.pull_request.number || inputs.issue_number }}/head

      - name: Run verifier
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.claude_token }}
          allowed_bots: 'github-actions'
          additional_permissions: |
            actions: read
          claude_args: '--allowedTools "Read,Glob,Grep,Bash,Edit,Write"'
          prompt: |
            Stage: verify. PR: ${{ github.event.pull_request.number || inputs.issue_number }}.

            Check out the PR branch. Run the project's tests, lint, and typecheck.
            Common entry points to try (in order): pnpm test / pnpm lint / pnpm type-check;
            npm test / npm run lint / npm run typecheck; bun test.

            Post a single PR comment with the command exit codes and a short
            excerpt of any failing output.

            If a check fails and the fix is mechanical (formatting, import order,
            obvious typos), commit the fix to the same branch and push. Do not
            attempt non-trivial fixes — that's the review-loop's job.

            Mark the PR as ready-for-review when all checks pass:
              gh pr ready ${{ github.event.pull_request.number || inputs.issue_number }}

      - name: Transition on success
        if: success()
        uses: Digitaliko/wizrd-cli/.github/actions/wizrd-transition@v1
        with:
          issue_number: ${{ github.event.pull_request.number || inputs.issue_number }}
          current_label: 'wizrd:verify'
          mode: success-terminal

      - name: Park on failure
        if: failure()
        uses: Digitaliko/wizrd-cli/.github/actions/wizrd-transition@v1
        with:
          issue_number: ${{ github.event.pull_request.number || inputs.issue_number }}
          current_label: 'wizrd:verify'
          mode: failure
