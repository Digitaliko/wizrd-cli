name: Wizrd Review

# Multi-agent PR code review.
#
# Uses the official Anthropic `code-review@claude-code-plugins` slash command
# which spawns 4 parallel agents (2× CLAUDE.md compliance, 1× bug detector,
# 1× git-history context), confidence-scores findings (≥80 to surface), and
# posts the result on the PR.
#
# `extra_instructions` lets callers add repo-specific rules (e.g. point at
# REVIEW_RULES.md / CODE_REVIEW.md, append B/R/A rule codes, override format).
# The plugin agents see this text as additional context.
#
# NOTE: claude-code-action@v1 only runs on PRs where the calling workflow
# file is identical to the version on `main`. First-time setup: merge the
# caller's wizrd.yml to main BEFORE expecting reviews on feature branches.

on:
  workflow_call:
    inputs:
      extra_instructions:
        description: 'Optional repo-specific guidance appended to the slash command. Use this to point at REVIEW_RULES.md, add rule codes, etc.'
        required: false
        type: string
        default: ''
    secrets:
      claude_token:
        description: 'CLAUDE_CODE_OAUTH_TOKEN'
        required: true

jobs:
  review:
    name: review
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: read
      id-token: write
      actions: read
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.claude_token }}
          plugin_marketplaces: 'https://github.com/anthropics/claude-code.git'
          plugins: 'code-review@claude-code-plugins'
          prompt: |
            /code-review:code-review ${{ github.repository }}/pull/${{ github.event.pull_request.number }}

            Before reviewing, read these if present (in this order — first one wins):
            REVIEW_RULES.md → CODE_REVIEW.md → CLAUDE.md → .claude/ci-agent-context.md

            If REVIEW_RULES.md uses rule codes (e.g. B1, R3, A2), reference them
            verbatim in each finding.

            Use this output format:
              ### 🔴 BLOCKING (must fix before merge)
              ### 🟡 REQUIRED (should fix before merge)
              ### 🟢 ADVISORY (reviewer discretion — skip section if none)
              ### ✅ What's Good

            Cite `file:line` for every code finding. Skip auto-generated files,
            lockfiles, and migration boilerplate.

            ${{ inputs.extra_instructions }}
