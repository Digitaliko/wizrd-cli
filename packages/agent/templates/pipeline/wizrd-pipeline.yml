# Generated by `wizrd pipeline init`. Re-run with --force to regenerate.
name: Wizrd Pipeline

on:
  # Tagger fan-in: any new/edited issue gets considered.
  issues:
    types: [opened, reopened, labeled, assigned]
  # Post-merge fan-in: closes the loop via doc-gardening.
  pull_request:
    types: [closed]
  # Each stage's labeled-trigger lives in its composite — but we need a
  # per-repo dispatch entry point so humans can manually start a stage.
  workflow_dispatch:
    inputs:
      stage:
        description: 'triage | plan | implement | review | fix | verify | doc-gardening'
        required: true
        type: choice
        options: [triage, plan, implement, review, fix, verify, doc-gardening]
      issue_number:
        description: 'Issue or PR number'
        required: true
        type: string

jobs:
  tagger:
    if: ${{ github.event_name == 'issues' }}
    uses: Digitaliko/wizrd-cli/.github/workflows/wizrd-tagger.yml@v1
    with:
      first_stage_label: 'wizrd:triage'
      first_stage_workflow: 'wizrd-pipeline.yml'
      filter_kind: __FILTER_KIND__
      filter_value: '__FILTER_VALUE__'

  triage:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.stage == 'triage' }}
    uses: Digitaliko/wizrd-cli/.github/workflows/wizrd-stage-triage.yml@v1
    with:
      issue_number: ${{ inputs.issue_number }}
    secrets:
      claude_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}

  plan:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.stage == 'plan' }}
    uses: Digitaliko/wizrd-cli/.github/workflows/wizrd-stage-plan.yml@v1
    with:
      issue_number: ${{ inputs.issue_number }}
      mode: human-approval
    secrets:
      claude_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}

  implement:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.stage == 'implement' }}
    uses: Digitaliko/wizrd-cli/.github/workflows/wizrd-stage-implement.yml@v1
    with:
      issue_number: ${{ inputs.issue_number }}
      base_branch: __BASE_BRANCH__
    secrets:
      claude_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}

  review:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.stage == 'review' }}
    uses: Digitaliko/wizrd-cli/.github/workflows/wizrd-stage-review.yml@v1
    with:
      issue_number: ${{ inputs.issue_number }}
    secrets:
      claude_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}

  fix:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.stage == 'fix' }}
    uses: Digitaliko/wizrd-cli/.github/workflows/wizrd-stage-fix.yml@v1
    with:
      issue_number: ${{ inputs.issue_number }}
    secrets:
      claude_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}

  verify:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.stage == 'verify' }}
    uses: Digitaliko/wizrd-cli/.github/workflows/wizrd-stage-verify.yml@v1
    with:
      issue_number: ${{ inputs.issue_number }}
    secrets:
      claude_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}

  # Post-merge: doc-gardening closes the loop. Auto-fires on every merged PR.
  doc-gardening-auto:
    if: ${{ github.event_name == 'pull_request' && github.event.pull_request.merged == true }}
    uses: Digitaliko/wizrd-cli/.github/workflows/wizrd-stage-doc-gardening.yml@v1
    with:
      pr_number: ${{ github.event.pull_request.number }}
      docs_root: __DOCS_ROOT__
    secrets:
      claude_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}

  doc-gardening:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.stage == 'doc-gardening' }}
    uses: Digitaliko/wizrd-cli/.github/workflows/wizrd-stage-doc-gardening.yml@v1
    with:
      pr_number: ${{ inputs.issue_number }}
      docs_root: __DOCS_ROOT__
    secrets:
      claude_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
